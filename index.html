<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Chat</title>
<style>
:root{
  --bg:#ffffff; --panel:#f6f7f9; --text:#111418; --muted:#6b7280; --line:#e5e7eb;
  --mine:#2563eb; --mine-text:#fff; --theirs:#eef0f3; --ok:#16a34a; --warn:#d97706; --err:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e1013; --panel:#16191e; --text:#e7e9ed; --muted:#8a92a0; --line:#232832;
         --mine:#3b6fe0; --theirs:#1e232b; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hidden{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* Join screen */
#join{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
#join form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
#join h1{margin:0 0 4px;font-size:22px;font-weight:600}
#join p{margin:0;color:var(--muted);font-size:13px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--mine)}
.primary{background:var(--mine);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600}
.primary:active{opacity:.85}
.link{background:none;border:0;color:var(--mine);padding:0;font-size:12px}
.row-between{display:flex;justify-content:space-between;align-items:center}
#join-error{color:var(--err);font-size:13px;min-height:1em}

/* Chat screen */
#chat{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);padding-top:max(10px,env(safe-area-inset-top))}
.who{min-width:0}
.who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)} .dot.wait{background:var(--warn)}
.actions{display:flex;gap:4px;flex:none}
.actions button{background:none;border:0;color:var(--muted);padding:6px 8px;border-radius:8px;font-size:13px}
.actions button:hover{background:var(--panel);color:var(--text)}

#list{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.row{display:flex;transition:opacity .6s}
.row.fade{opacity:.4}
.row.me{justify-content:flex-end}
.bubble{max-width:78%;padding:7px 11px;border-radius:16px;background:var(--theirs);word-break:break-word;white-space:pre-wrap}
.me .bubble{background:var(--mine);color:var(--mine-text)}
.bubble img{display:block;max-width:100%;max-height:260px;border-radius:10px;cursor:zoom-in;margin:2px 0}
.meta{font-size:10.5px;opacity:.65;text-align:right;margin-top:2px;white-space:normal}
.tick.fail{color:#fecaca;opacity:1}
.note{align-self:center;font-size:12px;color:var(--muted);padding:2px 0}
#typing{height:20px;padding:0 16px;font-size:12px;color:var(--muted)}

#composer{display:flex;align-items:flex-end;gap:8px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#composer textarea{flex:1;resize:none;max-height:120px;padding:9px 12px;border:1px solid var(--line);border-radius:18px;background:var(--panel);outline:none;line-height:1.4}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--panel);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none;font-size:18px}
#send{background:var(--mine);color:#fff}

#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#toast.show{opacity:1}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>
<body>

<!-- Join -->
<div id="join">
  <form id="join-form" autocomplete="off">
    <div>
      <h1>Chat</h1>
      <p>Private and end-to-end encrypted. Nothing is saved, and messages vanish after 5 minutes.</p>
    </div>
    <div>
      <label for="name">Your name</label>
      <input id="name" type="text" maxlength="24" required>
    </div>
    <div>
      <div class="row-between">
        <label for="room" style="margin:0">Room code</label>
        <button type="button" id="gen" class="link">Generate</button>
      </div>
      <input id="room" type="text" maxlength="48" required spellcheck="false" style="margin-top:4px">
    </div>
    <div id="join-error"></div>
    <button class="primary" type="submit">Join</button>
  </form>
</div>

<!-- Chat -->
<div id="chat" class="hidden">
  <header>
    <div class="who">
      <b id="title">Chat</b>
      <span class="status"><span id="dot" class="dot"></span><span id="status">Connecting…</span></span>
    </div>
    <div class="actions">
      <button id="invite" type="button">Invite</button>
      <button id="clear" type="button">Clear</button>
      <button id="leave" type="button">Leave</button>
    </div>
  </header>
  <div id="list"></div>
  <div id="typing"></div>
  <form id="composer">
    <label class="icon-btn" for="file" title="Send photo" style="margin:0;cursor:pointer">📎</label>
    <input id="file" type="file" accept="image/*" class="hidden">
    <textarea id="input" rows="1" placeholder="Message"></textarea>
    <button id="send" class="icon-btn" type="submit" title="Send">➤</button>
  </form>
</div>

<div id="toast"></div>
<div id="lightbox" class="hidden"><img alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(() => {
'use strict';

/* ---------------------------------------------------------------
   Design notes (two-person use)
   - Two public MQTT brokers are used at the same time. Messages are
     sent to both and de-duplicated, so there is no "split brain" if
     one broker is down, and no failover logic to go wrong.
   - Everything is AES-GCM encrypted with a key derived from the room
     code, so the public brokers only ever see ciphertext.
   - No heartbeat spam: one tiny presence ping every 20s.
   - Nothing is saved: messages live in memory only and vanish 5 minutes
     after they are sent (the broker is also told to expire them, MQTT 5).
   - No framework, no icon fonts, no animations, no blur effects.
---------------------------------------------------------------- */

const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const PRESENCE_EVERY = 20000;
const PRESENCE_TIMEOUT = 55000;
const MESSAGE_TTL = 5 * 60 * 1000;   // every message disappears after 5 minutes
const SWEEP_EVERY = 2000;
const MAX_IMAGE_CHARS = 140000;

const $ = (id) => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

const S = {
  me: sessionStorage.getItem('qc-id') || (() => { const v = rid(); sessionStorage.setItem('qc-id', v); return v; })(),
  name: '', room: '', topic: '', key: null,
  clients: [], connected: 0,
  partner: null, partnerOnline: false, lastSeen: 0,
  msgs: [], els: new Map(), seen: new Set(),
  lastTypingSent: 0, typingTimer: null,
  presenceTimer: null, checkTimer: null, sweepTimer: null,
  byePayload: null, unread: 0
};

/* ---------- crypto ---------- */
function b64e(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64d(s) {
  const b = atob(s), u = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return u;
}
async function deriveKeys(code) {
  const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode('quiet-chat-v1:' + code), iterations: 150000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode('topic:' + code)));
  const topic = 'quietchat/v1/' + Array.from(h.slice(0, 16), (b) => b.toString(16).padStart(2, '0')).join('');
  return { key, topic };
}
async function seal(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, S.key, enc.encode(JSON.stringify(obj))));
  const out = new Uint8Array(12 + ct.length);
  out.set(iv); out.set(ct, 12);
  return b64e(out);
}
async function unseal(str) {
  try {
    const b = b64d(str);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, S.key, b.slice(12));
    return JSON.parse(dec.decode(pt));
  } catch { return null; }
}

/* ---------- transport ---------- */
function publishRaw(payload, qos, onOk) {
  let done = false;
  for (const c of S.clients) {
    if (qos === 0 && !c.connected) continue;          // never queue typing/presence
    const opts = qos === 1 ? { qos, properties: { messageExpiryInterval: MESSAGE_TTL / 1000 } } : { qos };
    c.publish(S.topic, payload, opts, (err) => {
      if (!err && !done) { done = true; if (onOk) onOk(); }
    });
  }
}
async function send(obj, qos = 0, onOk) {
  obj.pid = obj.pid || rid();
  obj.from = S.me;
  obj.name = S.name;
  publishRaw(await seal(obj), qos, onOk);
}

function connectAll() {
  S.clients = BROKERS.map((url) => {
    const c = mqtt.connect(url, {
      clientId: 'qc_' + S.me,
      protocolVersion: 5,           // MQTT 5: the broker itself enforces message/session expiry
      clean: false,                 // broker may hold undelivered (encrypted) messages for the offline side, max 5 min
      properties: { sessionExpiryInterval: MESSAGE_TTL / 1000 },
      keepalive: 30,
      reconnectPeriod: 2000,
      connectTimeout: 8000,
      queueQoSZero: false,
      resubscribe: true
    });
    let up = false;
    c.on('connect', () => {
      if (!up) { up = true; S.connected++; }
      c.subscribe(S.topic, { qos: 1 });
      renderStatus();
      send({ t: 'hello' });
    });
    c.on('close', () => { if (up) { up = false; S.connected--; renderStatus(); } });
    c.on('error', () => {});
    c.on('message', (_t, payload) => onPayload(payload.toString()));
    return c;
  });

  S.presenceTimer = setInterval(() => send({ t: 'hello', re: 1 }), PRESENCE_EVERY);
  S.checkTimer = setInterval(() => {
    if (S.partnerOnline && Date.now() - S.lastSeen > PRESENCE_TIMEOUT) { S.partnerOnline = false; renderStatus(); }
  }, 10000);
}

function disconnectAll() {
  clearInterval(S.presenceTimer); clearInterval(S.checkTimer); clearInterval(S.sweepTimer);
  for (const c of S.clients) { try { c.end(true); } catch {} }
  S.clients = []; S.connected = 0;
}

async function onPayload(str) {
  const p = await unseal(str);
  if (!p || !p.pid || p.from === S.me) return;
  if (S.seen.has(p.pid)) return;                       // duplicate from the second broker
  S.seen.add(p.pid);
  if (S.seen.size > 800) S.seen = new Set(Array.from(S.seen).slice(-400));

  if (p.name) S.partner = p.name;
  if (p.t === 'bye') { S.partnerOnline = false; renderStatus(); return; }
  S.lastSeen = Date.now();
  if (!S.partnerOnline) { S.partnerOnline = true; }
  renderStatus();

  switch (p.t) {
    case 'hello': if (!p.re) send({ t: 'hello', re: 1 }); break;
    case 'typing': showTyping(); break;
    case 'ack': markDelivered(p.id); break;
    case 'msg': receiveMessage(p); break;
  }
}

/* ---------- messages ---------- */
function sendText(text, img) {
  text = (text || '').trim();
  if (!text && !img) return;
  const now = Date.now();
  const m = { id: rid(), me: true, name: S.name, text, img: img || null, ts: now, exp: now + MESSAGE_TTL, st: 'pending' };
  addMessage(m, true);
  send({ t: 'msg', id: m.id, text, img: m.img, ts: m.ts }, 1, () => setStatusOf(m.id, 'sent'));
  // If nothing confirmed after 15s, flag it so it is never silently lost.
  setTimeout(() => { const x = S.msgs.find((q) => q.id === m.id); if (x && x.st === 'pending') setStatusOf(m.id, 'failed'); }, 15000);
}

function receiveMessage(p) {
  if (S.msgs.some((m) => m.id === p.id)) return;
  const now = Date.now();
  const ts = Math.min(p.ts || now, now);          // ignore timestamps from the future
  if (now - ts >= MESSAGE_TTL) return;            // expired while queued: drop silently
  hideTyping();
  const m = { id: p.id, me: false, name: p.name, text: p.text || '', img: p.img || null, ts, exp: ts + MESSAGE_TTL, st: 'read' };
  addMessage(m, false);
  send({ t: 'ack', id: p.id });
  if (document.hidden) { S.unread++; document.title = `(${S.unread}) Chat`; }
}

function setStatusOf(id, st) {
  const m = S.msgs.find((x) => x.id === id);
  if (!m || (m.st === 'delivered' && st !== 'delivered')) return;
  m.st = st; updateTick(m);
}
function markDelivered(id) { setStatusOf(id, 'delivered'); }

function tickText(m) {
  return m.st === 'pending' ? '·' : m.st === 'sent' ? '✓' : m.st === 'delivered' ? '✓✓' : m.st === 'failed' ? '! not sent' : '';
}
function updateTick(m) {
  const row = S.els.get(m.id);
  if (!row) return;
  const t = row.querySelector('.tick');
  t.textContent = tickText(m);
  t.className = 'tick' + (m.st === 'failed' ? ' fail' : '');
}

/* ---------- rendering ---------- */
const list = $('list');
const nearBottom = () => list.scrollHeight - list.scrollTop - list.clientHeight < 140;
const toBottom = () => { list.scrollTop = list.scrollHeight; };

function buildRow(m) {
  const row = document.createElement('div');
  row.className = 'row ' + (m.me ? 'me' : 'them');
  const b = document.createElement('div');
  b.className = 'bubble';
  if (m.img) {
    const im = new Image();
    im.src = m.img; im.alt = 'Photo';
    im.onclick = () => { $('lightbox').querySelector('img').src = m.img; $('lightbox').classList.remove('hidden'); };
    im.onload = () => { if (m.me || nearBottom()) toBottom(); };
    b.appendChild(im);
  }
  if (m.text) { const t = document.createElement('div'); t.textContent = m.text; b.appendChild(t); }
  const meta = document.createElement('div');
  meta.className = 'meta';
  const time = new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  meta.append(time + (m.me ? ' ' : ''));
  if (m.me) { const t = document.createElement('span'); t.className = 'tick'; meta.appendChild(t); }
  b.appendChild(meta);
  row.appendChild(b);
  return row;
}

function addMessage(m, stick) {
  const wasNear = nearBottom();
  S.msgs.push(m);
  const row = buildRow(m);
  S.els.set(m.id, row);
  list.appendChild(row);
  if (m.me) updateTick(m);
  if (stick || wasNear) toBottom();
}

function renderStatus() {
  const dot = $('dot'), txt = $('status');
  if (S.connected === 0) { dot.className = 'dot'; txt.textContent = 'Connecting…'; return; }
  if (S.partnerOnline) { dot.className = 'dot on'; txt.textContent = (S.partner || 'Partner') + ' · online'; }
  else { dot.className = 'dot wait'; txt.textContent = S.partner ? S.partner + ' · offline' : 'Waiting for partner…'; }
  $('title').textContent = S.partner || 'Chat';
}

function showTyping() {
  $('typing').textContent = (S.partner || 'Partner') + ' is typing…';
  clearTimeout(S.typingTimer);
  S.typingTimer = setTimeout(hideTyping, 3000);
}
function hideTyping() { $('typing').textContent = ''; clearTimeout(S.typingTimer); }

let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- expiry: nothing is saved, everything vanishes ---------- */
function sweep() {
  const now = Date.now();
  let removed = false;
  for (const m of S.msgs) {
    const left = m.exp - now;
    const row = S.els.get(m.id);
    if (left <= 0) {
      if (row) row.remove();
      S.els.delete(m.id);
      m.dead = true; removed = true;
      if (m.img) { $('lightbox').classList.add('hidden'); $('lightbox').querySelector('img').src = ''; }
    } else if (left < 10000 && row && !row.classList.contains('fade')) {
      row.classList.add('fade');                    // fade out during the last 10 seconds
    }
  }
  if (removed) S.msgs = S.msgs.filter((m) => !m.dead);
}
function wipeMemory() {
  S.msgs = []; S.els.clear(); S.seen.clear();
  list.textContent = '';
  hideTyping();
}

/* ---------- photos ---------- */
async function shrinkImage(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  let max = 800, q = 0.7, url = '';
  for (let i = 0; i < 6; i++) {
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    url = c.toDataURL('image/jpeg', q);
    if (url.length <= MAX_IMAGE_CHARS) break;
    max *= 0.8; q = Math.max(0.4, q - 0.08);
  }
  if (bmp.close) bmp.close();
  if (url.length > MAX_IMAGE_CHARS) throw new Error('too big');
  return url;
}

/* ---------- join / leave ---------- */
function normRoom(v) { return (v || '').trim().toLowerCase(); }

function inviteUrl() {
  // The code goes in the #fragment, which browsers never send to the web server.
  return location.origin + location.pathname + '#room=' + encodeURIComponent(S.room);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;left:-999px';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); return ok;
  }
}

$('join-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('join-error'); err.textContent = '';
  if (!window.crypto || !crypto.subtle) { err.textContent = 'Needs HTTPS (or localhost) to encrypt messages.'; return; }
  if (typeof mqtt === 'undefined') { err.textContent = 'Could not load the network library. Check your connection and reload.'; return; }
  const name = $('name').value.trim();
  const room = normRoom($('room').value);
  if (room.length < 6) { err.textContent = 'Room code must be at least 6 characters.'; return; }

  const btn = e.submitter; if (btn) btn.disabled = true;
  try {
    const { key, topic } = await deriveKeys(room);
    S.name = name; S.room = room; S.key = key; S.topic = topic;
    S.byePayload = await seal({ t: 'bye', from: S.me, name, pid: 'bye_' + rid() });
  } catch { err.textContent = 'Could not start encryption.'; if (btn) btn.disabled = false; return; }
  if (btn) btn.disabled = false;

  $('join').classList.add('hidden');
  $('chat').classList.remove('hidden');
  wipeMemory();
  S.partner = null; S.partnerOnline = false;
  const note = document.createElement('div');
  note.className = 'note';
  note.textContent = 'Nothing is saved. Messages disappear 5 minutes after they are sent.';
  list.appendChild(note);
  renderStatus();
  connectAll();
  S.sweepTimer = setInterval(sweep, SWEEP_EVERY);
  if (matchMedia('(pointer:fine)').matches) $('input').focus();
});

$('gen').addEventListener('click', () => {
  const a = crypto.getRandomValues(new Uint8Array(9));
  $('room').value = Array.from(a, (b) => (b % 36).toString(36)).join('').replace(/(.{3})(?=.)/g, '$1-');
});

$('leave').addEventListener('click', () => {
  if (S.key && S.byePayload) publishRaw(S.byePayload, 0);
  setTimeout(disconnectAll, 150);
  $('chat').classList.add('hidden');
  $('join').classList.remove('hidden');
  S.key = null; S.topic = '';
  wipeMemory();                                   // messages, photos and keys are dropped from memory
  $('input').value = ''; $('room').value = '';
  document.title = 'Chat';
});

$('clear').addEventListener('click', () => {
  if (!confirm("Clear all messages from your screen now? The other person's screen is not affected.")) return;
  S.msgs = []; S.els.clear(); list.textContent = '';
});

$('invite').addEventListener('click', async () => {
  await copy(inviteUrl());
  toast('Invite link copied');
});

/* ---------- composer ---------- */
const input = $('input');
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  const now = Date.now();
  if (now - S.lastTypingSent > 2500) { S.lastTypingSent = now; send({ t: 'typing' }); }
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) {
    e.preventDefault(); $('composer').requestSubmit();
  }
});
$('composer').addEventListener('submit', (e) => {
  e.preventDefault();
  if (!input.value.trim()) return;
  sendText(input.value);
  input.value = ''; input.style.height = 'auto';
  S.lastTypingSent = 0;
  input.focus();
});
$('file').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f || !f.type.startsWith('image/')) return;
  try { sendText('', await shrinkImage(f)); }
  catch { toast('Could not send that photo'); }
});

$('lightbox').addEventListener('click', () => { $('lightbox').classList.add('hidden'); $('lightbox').querySelector('img').src = ''; });
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('lightbox').classList.add('hidden'); });

/* ---------- lifecycle ---------- */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    S.unread = 0; document.title = 'Chat';
    if (S.key) send({ t: 'hello' });               // re-announce after returning from background
  }
});
window.addEventListener('pagehide', () => { if (S.key && S.byePayload) publishRaw(S.byePayload, 0); });

/* ---------- init ---------- */
(function init() {
  // Remove chats saved by the previous version of this app.
  try { Object.keys(localStorage).filter((k) => k.startsWith('qc:')).forEach((k) => localStorage.removeItem(k)); } catch {}
  // Read the code from the invite link, then hide it from the address bar / history.
  const q = new URLSearchParams(location.hash.slice(1)).get('room') || new URLSearchParams(location.search).get('room');
  if (q) { $('room').value = q; history.replaceState(null, '', location.pathname); }
})();

})();
</script>
</body>
</html>
